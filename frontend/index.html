<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087ca8">
    <title>AI意思決定サポーター</title>
    <script src="/runtime-config.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { color-scheme: light; --ink: #203e50; --muted: #536f80; --accent: #087ca8; --line: #cce5f1; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f9ff; color: var(--ink); font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; line-height: 1.8; }
        [v-cloak] { display: none; }
        button, input, textarea { font: inherit; }
        button { cursor: pointer; min-height: 48px; border-radius: 12px; padding: 12px 22px; }
        button:disabled { cursor: not-allowed; opacity: .55; }
        :focus-visible { outline: 3px solid #d89b3e; outline-offset: 4px; }
        .shell { width: min(100% - 28px, 900px); margin: auto; }
        header { display: flex; align-items: center; gap: 12px; padding: 26px 0; border-bottom: 1px solid var(--line); }
        .logo { flex-shrink: 0; display: grid; place-items: center; background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 12px; font-size: 24px; }
        .muted { color: var(--muted); font-size: 13px; }
        .brand { font-size: 17px; font-weight: 700; }
        main { padding: 0 0 60px; }
        .navigation-row { position: relative; padding-top: 60px; }
        .usage { margin-bottom: 24px; padding: 20px 24px; background: #def2fc; border-radius: 14px; }
        .usage h1 { font-size: 20px; margin: 0 0 8px; }
        .usage p { margin: 0; font-size: 14px; }
        .steps { display: flex; justify-content: center; gap: 28px; padding: 0; margin: 0 0 36px; list-style: none; font-size: 13px; color: var(--muted); }
        .steps li { display: flex; gap: 9px; align-items: center; }
        .steps span { display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; width: 27px; height: 27px; }
        .steps .active { color: var(--accent); font-weight: 700; }
        .steps .active span { background: var(--accent); color: white; border-color: var(--accent); }
        .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .12em; font-weight: 700; }
        h1 { font-size: clamp(25px, 4.5vw, 37px); line-height: 1.6; margin: 10px 0 12px; letter-spacing: .03em; }
        .card { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 32px; box-shadow: 0 8px 28px #203e5005; }
        label { display: block; font-weight: 700; margin-bottom: 12px; }
        textarea, input { width: 100%; border: 1px solid #a9cddd; background: #f8fcff; border-radius: 12px; padding: 16px; color: var(--ink); }
        textarea { resize: vertical; min-height: 120px; }
        textarea::placeholder { color: #637f90; }
        .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .example { min-height: 40px; padding: 7px 14px; border: 1px solid #a9cddd; background: #e6f6ff; color: var(--ink); font-size: 13px; }
        .example:hover:not(:disabled) { background: #def2fc; border-color: var(--accent); }
        .primary { color: white; background: var(--accent); border: 1px solid var(--accent); font-weight: 700; }
        .primary:hover:not(:disabled) { background: #056389; }
        .secondary { background: white; border: 1px solid #a9cddd; color: var(--accent); }
        .actions { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-top: 20px; }
.actions-spacer { flex: 1; }
        .topic { padding: 18px 22px; background: #e1f3fc; border-radius: 12px; margin: 0 0 24px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .topic small { display: block; color: var(--muted); margin-bottom: 4px; }
        .question-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .badge { background: #def2fc; color: var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
        h2 { font-size: 22px; line-height: 1.7; margin: 18px 0; overflow-wrap: anywhere; }
        .choices { display: grid; gap: 12px; margin-top: 24px; }
        .choice { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 16px; border: 1px solid #bddfeb; background: white; color: var(--ink); }
        .choice:hover:not(:disabled), .choice.selected { border-color: var(--accent); background: #e6f6ff; }
        .answer-form { margin-top: 24px; }
        .number-row { display: flex; align-items: center; gap: 14px; }
        .number-row input { max-width: 320px; }
        .history-tab { position: absolute; left: 0; top: 10px; z-index: 10; display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 10px; border: 1px solid #a9cddd; border-left: 0; border-radius: 0 10px 10px 0; background: #def2fc; color: var(--ink); }
        .history-tab-label { font-size: 13px; font-weight: 700; }
        .history-count { font-size: 12px; }
        .history-panel { position: fixed; inset: 0 auto 0 0; margin: 0; width: min(380px, calc(100vw - 40px)); height: 100dvh; max-height: 100dvh; max-width: none; padding: 0; border: 0; border-right: 1px solid var(--line); background: #f8fcff; color: var(--ink); box-shadow: 8px 0 32px #203e5020; }
        .history-panel::backdrop { background: #203e5040; }
        .history-panel[open] { display: flex; flex-direction: column; animation: slide-in .18s ease-out; }
        .history-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: #def2fc; }
        .history-header h2 { font-size: 18px; margin: 0; }
        .history-content { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; overscroll-behavior: contain; }
        @keyframes slide-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @media (prefers-reduced-motion: reduce) { .history-panel[open] { animation: none; } }
        .history-item { padding: 16px 0; border-top: 1px solid var(--line); }
        .history-item p { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .history-item .answer { background: #e1f3fc; padding: 10px 16px; border-radius: 10px; margin-left: 30px; }
        .history-result { padding: 20px 0; border-top: 2px solid var(--accent); margin-top: 8px; }
        .history-result-header { margin-bottom: 12px; }
        .result-badge { background: var(--accent); color: white; }
        .history-result-title { font-size: 18px; font-weight: 700; color: var(--accent); margin: 8px 0; }
        .history-result-section { margin: 12px 0; }
        .history-result-section small { color: var(--muted); }
        .history-result-section p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .history-result-section ul { padding-left: 20px; margin: 4px 0; }
        .history-result-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .result-history { margin: 20px 0; padding: 16px 20px; background: #f0f9ff; border-radius: 12px; }
        .result-history-toggle { font-size: 14px; font-weight: 700; color: var(--accent); cursor: pointer; list-style: none; }
        .result-history-toggle::-webkit-details-marker { display: none; }
        .result-history-toggle::before { content: '▸ '; }
        .result-history[open] > .result-history-toggle::before { content: '▾ '; }
        .result-history-list { margin-top: 12px; }
        .result-history-item { padding: 10px 0; border-top: 1px solid var(--line); }
        .result-history-item:first-child { border-top: none; }
        .result-history-question { margin: 6px 0 2px; font-size: 14px; }
        .result-history-answer { margin: 0; padding: 8px 12px; background: #e1f3fc; border-radius: 8px; font-size: 14px; }
        .session-list { margin: 0; padding: 0; list-style: none; }
        .session-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
        .session-item:first-child { border-top: none; }
        .session-item-main { flex: 1; min-width: 0; cursor: pointer; }
        .session-item-main:hover { color: var(--accent); }
        .session-item-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .session-item-delete { flex-shrink: 0; min-height: 32px; padding: 4px 10px; border: 1px solid #e8b6aa; background: #fff3ef; color: #953e2c; border-radius: 8px; font-size: 12px; }
        .session-item-delete:hover { background: #f8d7cf; }
        .session-detail-back { margin-bottom: 12px; }
        .session-detail-back button { background: none; border: none; color: var(--accent); padding: 4px 0; font-size: 14px; font-weight: 700; min-height: auto; cursor: pointer; }
        .session-detail-result { margin-top: 16px; padding: 16px; background: #def2fc; border-radius: 12px; }
        .session-detail-result h3 { font-size: 16px; margin: 0 0 8px; color: var(--accent); }
        .loading { display: flex; align-items: center; gap: 12px; padding: 22px 0; color: var(--accent); }
        .loading-note { display: block; margin-top: 4px; font-size: 12px; color: var(--ink); font-weight: 400; }
        .spinner { width: 20px; height: 20px; border: 2px solid #b9e1f3; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
        .error { margin-top: 20px; padding: 18px; border: 1px solid #e8b6aa; border-radius: 12px; background: #fff3ef; color: #953e2c; }
        .error p { margin: 0 0 12px; }
        .gauge { margin-top: 20px; padding: 16px 20px; background: white; border: 1px solid var(--line); border-radius: 14px; }
        .gauge-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
        .gauge-row strong { color: var(--accent); font-size: 20px; }
        .gauge-track { height: 16px; background: #e1f3fc; border-radius: 999px; overflow: hidden; }
        .gauge-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
        .recommendation { background: #def2fc; text-align: center; padding: 28px; border-radius: 14px; }
        .recommendation h1 { color: var(--accent); }
        .result-section { margin-top: 28px; white-space: pre-wrap; overflow-wrap: anywhere; }
        h3 { font-size: 16px; margin: 0 0 12px; }
        .result-section p { margin: 0; }
        .result-section ul { padding-left: 24px; margin: 0; }
        .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .comparison section { padding: 20px; background: #f0f9ff; border-radius: 12px; }
        @media (max-width: 600px) {
            .card { padding: 22px; } .steps { gap: 14px; font-size: 12px; }
            .comparison { grid-template-columns: 1fr; gap: 16px; }
            .actions { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div id="app" class="shell" v-cloak>
        <dialog id="history-panel" ref="historyPanel" class="history-panel" aria-labelledby="history-title" @close="historyOpen = false" @click="closeHistoryOnBackdrop">
            <div class="history-header"><h2 id="history-title">履歴</h2><button type="button" class="secondary" autofocus @click="closeHistory">閉じる</button></div>
            <div class="history-content">
                <template v-if="selectedSession">
                    <div class="session-detail-back"><button type="button" @click="backToList">← 一覧に戻る</button></div>
                    <div class="topic"><small>相談日時</small>{{ selectedSession.date }}</div>
                    <div class="topic"><small>今回の相談</small>{{ selectedSession.consultation }}</div>
                    <p v-if="!selectedSession.history.length" class="muted">まだ回答履歴はありません。</p>
                    <details v-if="selectedSession.history.length" class="result-history">
                        <summary class="result-history-toggle">質問履歴を見る（{{ selectedSession.history.length }}件）</summary>
                        <div class="result-history-list">
                            <div v-for="(item, i) in selectedSession.history" :key="i" class="result-history-item"><span class="badge">質問 {{ i + 1 }}</span><p class="result-history-question">{{ item.question }}</p><p class="result-history-answer">{{ item.answer }}</p></div>
                        </div>
                    </details>
                    <div v-if="selectedSession.result" class="history-result">
                        <div class="history-result-header"><span class="badge result-badge">AIのおすすめ</span></div>
                        <p class="history-result-title">{{ selectedSession.result.recommendation }}</p>
                        <div class="history-result-section"><small>理由</small><p>{{ selectedSession.result.reason }}</p></div>
                        <div class="history-result-section"><small>判断条件</small><ul><li v-for="(c, i) in selectedSession.result.conditions" :key="i">{{ c }}</li></ul></div>
                        <div class="history-result-compare">
                            <div class="history-result-section"><small>メリット</small><ul><li v-for="(p, i) in selectedSession.result.pros" :key="i">{{ p }}</li></ul></div>
                            <div class="history-result-section"><small>デメリット</small><ul><li v-for="(c, i) in selectedSession.result.cons" :key="i">{{ c }}</li></ul></div>
                        </div>
                        <div class="history-result-section"><small>別の選択肢</small><p>{{ selectedSession.result.alternative }}</p></div>
                    </div>
                </template>
                <template v-else>
                    <div v-if="stage !== 'start'" class="topic"><small>今回の相談</small>{{ consultation }}</div>
                    <p v-if="!history.length && !(pending && pending.answer !== null)" class="muted">まだ回答履歴はありません。</p>
                    <details v-if="stage === 'result' && history.length" class="result-history">
                        <summary class="result-history-toggle">質問履歴を見る（{{ history.length }}件）</summary>
                        <div class="result-history-list">
                            <div v-for="(item, i) in history" :key="i" class="result-history-item"><span class="badge">質問 {{ i + 1 }}</span><p class="result-history-question">{{ item.question }}</p><p class="result-history-answer">{{ item.answer }}</p></div>
                        </div>
                    </details>
                    <template v-else>
                    <div v-for="(item, i) in history" :key="i" class="history-item"><span class="badge">質問 {{ i + 1 }}</span><p>{{ item.question }}</p><p class="answer"><small>あなたの回答</small><br>{{ item.answer }}</p></div>
                    <div v-if="pending && pending.answer !== null" class="history-item"><span class="badge">{{ loading ? '送信中' : '未完了' }}</span><p>{{ question.question }}</p><p class="answer"><small>あなたの回答</small><br>{{ pending.answer }}</p></div>
                    </template>
                    <div v-if="stage === 'result' && result" class="history-result">
                        <div class="history-result-header"><span class="badge result-badge">AIのおすすめ</span></div>
                        <p class="history-result-title">{{ result.recommendation }}</p>
                        <div class="history-result-section"><small>理由</small><p>{{ result.reason }}</p></div>
                        <div class="history-result-section"><small>判断条件</small><ul><li v-for="(c, i) in result.conditions" :key="i">{{ c }}</li></ul></div>
                        <div class="history-result-compare">
                            <div class="history-result-section"><small>メリット</small><ul><li v-for="(p, i) in result.pros" :key="i">{{ p }}</li></ul></div>
                            <div class="history-result-section"><small>デメリット</small><ul><li v-for="(c, i) in result.cons" :key="i">{{ c }}</li></ul></div>
                        </div>
                        <div class="history-result-section"><small>別の選択肢</small><p>{{ result.alternative }}</p></div>
                    </div>
                    <div class="history-result">
                        <div class="history-result-header"><span class="badge result-badge">過去の相談</span></div>
                        <p v-if="!savedSessions.length" class="muted">まだ過去の相談はありません。</p>
                        <ul class="session-list">
                            <li v-for="session in savedSessions" :key="session.id" class="session-item">
                                <div class="session-item-main" @click="viewSession(session)" role="button" tabindex="0" @keydown.enter="viewSession(session)">
                                    <div class="session-item-title">{{ session.consultation }}</div>
                                    <div class="session-item-meta">{{ session.date }}<template v-if="session.result">・{{ session.result.recommendation }}</template></div>
                                </div>
                                <button type="button" class="session-item-delete" @click="deleteSession(session)">削除</button>
                            </li>
                        </ul>
                    </div>
                </template>
            </div>
        </dialog>
        <header><span class="logo" aria-hidden="true">✦</span><span class="brand">AI意思決定サポーター</span></header>
        <main :aria-busy="loading">
            <div class="navigation-row">
        <button ref="historyTab" type="button" class="history-tab" aria-controls="history-panel" aria-haspopup="dialog" :aria-expanded="historyOpen" @click="openHistory">
            <span class="history-tab-label">履歴</span><span class="history-count">{{ history.length }}</span><span aria-hidden="true">›</span>
        </button>
            <ol class="steps" aria-label="相談のステップ">
                <li :class="{ active: stage === 'start' }" :aria-current="stage === 'start' ? 'step' : null"><span>1</span>相談する</li>
                <li :class="{ active: stage === 'question' }" :aria-current="stage === 'question' ? 'step' : null"><span>2</span>条件を整理</li>
                <li :class="{ active: stage === 'result' }" :aria-current="stage === 'result' ? 'step' : null"><span>3</span>おすすめ</li>
            </ol>
            </div>
            <section v-if="stage === 'start'">
                <section class="usage" aria-labelledby="usage-heading">
                    <h1 id="usage-heading">使い方</h1>
                    <p>迷っている内容を入力し、AIの質問に回答すると、おすすめと理由が表示されます。</p>
                </section>
                <form class="card" @submit.prevent="startConsultation">
                    <label for="consultation">何について迷っていますか？</label>
                    <textarea id="consultation" ref="consultationInput" v-model="consultation" :disabled="loading" rows="4" placeholder="例：大学用のPCをノートPCにするか、デスクトップPCにするか迷っています。"></textarea>
                    <div class="examples" role="group" aria-label="相談例を入力">
                        <button v-for="example in examples" :key="example.label" type="button" class="example" :disabled="loading" @click="consultation = example.text">{{ example.label }}</button>
                    </div>
                    <div class="actions"><button type="submit" class="primary" :disabled="loading">相談する <span aria-hidden="true">→</span></button></div>
                </form>
            </section>
            <template v-if="stage !== 'start'">
                <div class="topic"><small>今回の相談</small>{{ consultation }}</div>
                <section v-if="stage === 'question' && question" class="card">
                    <div class="question-top"><span class="badge">AIからの質問</span><span class="muted">質問 {{ history.length + 1 }}</span></div>
                    <h2 ref="questionHeading" tabindex="-1">{{ question.question }}</h2>
                    <div v-if="question.answer_type === 'choice'" class="choices">
                        <button v-for="option in question.options" :key="option" type="button" class="choice" :class="{ selected: selectedOption === option }" :disabled="loading" @click="choose(option)"><span>{{ option }}</span><span aria-hidden="true">→</span></button>
                        <button v-if="!question.options.some(option => /わから|分から|決められない|未定|どちらとも/.test(option))" type="button" class="choice" :disabled="loading" @click="choose('わからない・決められない')"><span>わからない・決められない</span><span aria-hidden="true">→</span></button>
                    </div>
                    <form v-if="question.answer_type !== 'choice' || showOther" class="answer-form" @submit.prevent="submitInput">
                        <template v-if="question.answer_type === 'number'">
                            <label for="numberAnswer">数値を入力してください</label>
                            <div class="number-row"><input id="numberAnswer" v-model="answerInput" type="number" step="any" min="0" :disabled="loading" aria-describedby="answerUnit"><span id="answerUnit">{{ question.unit }}</span></div>
                        </template>
                        <template v-else><label for="textAnswer">{{ showOther ? 'その他の回答を入力してください' : 'あなたの回答' }}</label><textarea id="textAnswer" ref="textAnswer" v-model="answerInput" :disabled="loading" rows="3"></textarea></template>
                        <div class="actions"><button type="submit" class="primary" :disabled="loading">{{ question.answer_type === 'number' ? '決定' : '送信' }}</button></div>
                    </form>
                    <button v-if="question.answer_type !== 'choice'" type="button" class="secondary" :disabled="loading" @click="submitAnswer('わからない・決められない')">わからない・決められない</button>
                    <div class="actions" v-if="stage === 'question'">
                        <button type="button" class="secondary" :disabled="loading" @click="skipQuestion">質問がおかしい・スキップ</button>
                        <span class="actions-spacer" aria-hidden="true"></span>
                        <button type="button" class="secondary" :disabled="loading" @click="finishEarly">ここで結論を出す</button>
                    </div>
                </section>
                <section v-if="stage === 'result' && result" class="card">
                    <div class="recommendation"><span class="eyebrow">あなたへのおすすめ</span><h1 ref="resultHeading" tabindex="-1">{{ result.recommendation }}</h1></div>
                    <details class="result-history">
                        <summary class="result-history-toggle">質問履歴を見る（{{ history.length }}件）</summary>
                        <div class="result-history-list">
                            <div v-for="(item, i) in history" :key="i" class="result-history-item">
                                <span class="badge">質問 {{ i + 1 }}</span>
                                <p class="result-history-question">{{ item.question }}</p>
                                <p class="result-history-answer">{{ item.answer }}</p>
                            </div>
                        </div>
                    </details>
                    <section class="result-section"><h3>判断に使った条件</h3><ul><li v-for="(condition, i) in result.conditions" :key="i">{{ condition }}</li></ul></section>
                    <section class="result-section"><h3>おすすめする理由</h3><p>{{ result.reason }}</p></section>
                    <div class="comparison"><section class="result-section"><h3>メリット</h3><ul><li v-for="(pro, i) in result.pros" :key="i">{{ pro }}</li></ul></section><section class="result-section"><h3>デメリット</h3><ul><li v-for="(con, i) in result.cons" :key="i">{{ con }}</li></ul></section></div>
                    <section class="result-section"><h3>別の選択肢が向いている場合</h3><p>{{ result.alternative }}</p></section>
                    <div class="actions"><button class="primary" type="button" @click="reset">別の相談をする</button></div>
                </section>
            </template>
            <div v-if="stage === 'question' || stage === 'result'" class="gauge">
                <div class="gauge-row"><span class="muted">結論を出せる確信度</span><strong>{{ confidence }}%</strong></div>
                <div class="gauge-track" role="progressbar" :aria-valuenow="confidence" aria-valuemin="0" aria-valuemax="100" aria-label="確信度"><div class="gauge-fill" :style="{ width: Math.min(confidence, 100) + '%' }"></div></div>
            </div>
            <div v-if="loading" class="loading" role="status"><span class="spinner" aria-hidden="true"></span><span>{{ pending && pending.forceResult ? 'AIがおすすめをまとめています…' : 'AIが判断条件と質問を確認しています…' }}<small class="loading-note">PCのスペック（CPU・GPU・搭載メモリ）が低い場合、30秒から数分かかる場合があります。</small></span></div>
            <div v-if="error" class="error" role="alert"><p>{{ error }}</p><button v-if="pending" class="secondary" type="button" :disabled="loading" @click="sendRequest">同じ内容で再試行</button></div>
            <p v-if="pending && pending.answer !== null" class="muted">送信した回答：{{ pending.answer }}</p>
        </main>
    </div>
    <noscript>このアプリを利用するには、ブラウザのJavaScriptを有効にしてください。</noscript>
    <script>
        Vue.createApp({
            data() {
                return {
                    stage: 'start', consultation: '', question: null, result: null, history: [],
                    answerInput: '', selectedOption: '', showOther: false, loading: false, error: '', pending: null, historyOpen: false, confidence: 0,
                    savedSessions: [], selectedSession: null, skippedQuestions: [],
examples: [
                        { label: 'PC選び', text: '大学用のPCをノートPCにするかデスクトップPCにするか迷っています。' },
                        { label: '車の利用', text: '車を買うかカーシェアを利用するか迷っています。' },
                        { label: 'ジム', text: 'ダイエットのためにジムに通うか、自宅で筋トレを始めるか迷っています。' }
                    ]
                };
            },
            methods: {
                loadSessions() {
                    try {
                        this.savedSessions = JSON.parse(localStorage.getItem('savedSessions') || '[]');
                        if (!Array.isArray(this.savedSessions)) this.savedSessions = [];
                    } catch { this.savedSessions = []; }
                },
                saveSessions() {
                    try {
                        localStorage.setItem('savedSessions', JSON.stringify(this.savedSessions));
                    } catch { }
                },
                openHistory() {
                    this.$refs.historyPanel.showModal();
                    this.historyOpen = true;
                },
                closeHistory() {
                    this.$refs.historyPanel.close();
                    this.historyOpen = false;
                    this.$refs.historyTab.focus();
                },
                closeHistoryOnBackdrop(event) {
                    if (event.target !== this.$refs.historyPanel) return;
                    const bounds = this.$refs.historyPanel.getBoundingClientRect();
                    if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) this.closeHistory();
                },
                startConsultation() {
                    if (this.loading) return;
                    if (!this.consultation.trim()) { this.error = '相談内容を入力してください。'; return; }
                    this.pending = { consultation: this.consultation.trim(), history: [], answer: null };
                    this.confidence = 0;
                    return this.sendRequest();
                },
                choose(option) {
                    if (this.loading) return;
                    this.selectedOption = option;
                    this.showOther = option.trim() === 'その他';
                    if (this.showOther) {
                        this.error = ''; this.pending = null;
                        this.$nextTick(() => this.$refs.textAnswer?.focus());
                        return;
                    }
                    return this.submitAnswer(option);
                },
                submitInput() {
                    if (this.loading || !this.question) return;
                    const value = String(this.answerInput).trim();
                    if (!value) { this.error = '回答を入力してください。'; return; }
                    if (this.question.answer_type === 'number') {
                        const numeric = Number(value);
                        if (!Number.isFinite(numeric)) { this.error = '有効な数値を入力してください。'; return; }
                        if (numeric < 0) { this.error = '0以上の数値を入力してください。'; return; }
                    }
                    return this.submitAnswer(this.question.answer_type === 'number' ? `${value}${this.question.unit || ''}` : value);
                },
                submitAnswer(answer) {
                    if (this.loading || !this.question) return;
                    // Commit history only after success so retries never duplicate answers.
                    this.pending = { consultation: this.consultation, history: [...this.history, { question: this.question.question, answer }], answer };
                    return this.sendRequest();
                },
                finishEarly() {
                    if (this.loading || !this.question) return;
                    this.pending = { consultation: this.consultation, history: [...this.history], answer: null, forceResult: true };
                    return this.sendRequest();
                },
                parseResponse(payload) {
                    let data = payload?.processed_text ?? payload;
                    if (typeof data === 'string') {
                        const text = data.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
                        try { data = JSON.parse(text); } catch { throw new Error('AIの応答を読み取れませんでした。再試行してください。'); }
                    }
                    const nonempty = value => typeof value === 'string' && value.trim().length > 0;
                    const list = value => Array.isArray(value) && value.length > 0 && value.every(nonempty);
                    if (data?.status === 'question' && nonempty(data.question)) {
                        if (!['choice', 'number', 'text'].includes(data.answer_type)) throw new Error('AIの回答形式が不正です。再試行してください。');
                        if (data.answer_type === 'choice' && (!list(data.options) || data.options.length < 2 || data.options.length > 5 || new Set(data.options).size !== data.options.length)) throw new Error('AIの選択肢が不正です。再試行してください。');
                        if (data.answer_type === 'choice' && data.options.some(o => /\?|？/.test(o) || o.length > 24)) throw new Error('AIの選択肢が質問文になっています。再試行してください。');
                        if (data.answer_type === 'number' && typeof data.unit !== 'string') throw new Error('数値の単位を取得できませんでした。再試行してください。');
                        // 意味の審査はサーバーで行う。小数や自然な語句まで禁止しない。
                        if (data.question.trim().length < 4 || data.question.length > 100 || /[\r\n]/.test(data.question)) throw new Error('AIの質問文の形式が不正です。再試行してください。');
                        return data;
                    }
                    if (data?.status === 'result' && ['recommendation', 'reason', 'alternative'].every(key => nonempty(data[key])) && ['conditions', 'pros', 'cons'].every(key => list(data[key]))) return data;
                    throw new Error('AIから必要な情報を取得できませんでした。再試行してください。');
                },
async sendRequest() {
                    if (this.loading || !this.pending) return;
                    this.loading = true; this.error = '';
                    const submitted = this.pending;
                    const controller = new AbortController();
                    const timeoutMs = Number.isFinite(globalThis.APP_REQUEST_TIMEOUT_MS) ? globalThis.APP_REQUEST_TIMEOUT_MS : 190000;
                    const timeout = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const response = await fetch('/send_api', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
                            body: JSON.stringify({
                                consultation: submitted.consultation, history: submitted.history,
                                ...(submitted.forceResult ? { force_result: true } : {}),
                                skipped_questions: this.skippedQuestions,
                                ...(submitted.skipQuestion ? { skip_question: submitted.skipQuestion } : {})
                            })
                        });
                        const payload = await response.json();
                        if (!response.ok) throw new Error(typeof payload.error === 'string' ? payload.error : 'AIとの通信に失敗しました。時間をおいて再試行してください。');
                        const data = this.parseResponse(payload);
                        if (data.status === 'question' && submitted.forceResult) throw new Error('結論を求めましたが、AIが質問を返しました。再試行してください。');
                        this.consultation = submitted.consultation; this.history = submitted.history; this.stage = data.status;
                        this.question = data.status === 'question' ? data : null;
                        this.result = data.status === 'result' ? data : null;
                        this.confidence = Number.isFinite(data.confidence) ? Math.max(0, Math.min(100, data.confidence)) : 0;
                        if (submitted.skipQuestion && !this.skippedQuestions.includes(submitted.skipQuestion)) this.skippedQuestions.push(submitted.skipQuestion);
                        this.answerInput = ''; this.selectedOption = ''; this.showOther = false; this.pending = null;
                        if (data.status === 'result') this.saveSession();
                        this.$nextTick(() => (this.$refs.questionHeading || this.$refs.resultHeading)?.focus());
                    } catch (error) {
                        this.error = error.name === 'AbortError' ? '応答に時間がかかっています。入力は保持されています。再試行してください。' : error instanceof TypeError ? 'AIとの通信に失敗しました。接続を確認して再試行してください。' : error instanceof SyntaxError ? 'サーバーの応答を読み取れませんでした。再試行してください。' : error.message;
                    } finally {
                        clearTimeout(timeout); this.loading = false;
                    }
                },
                reset() {
                    if (this.loading) return;
                    this.stage = 'start'; this.consultation = ''; this.question = null; this.result = null;
                    this.history = []; this.answerInput = ''; this.selectedOption = ''; this.showOther = false;
                    this.error = ''; this.pending = null; this.confidence = 0; this.selectedSession = null; this.skippedQuestions = [];
                    this.$nextTick(() => this.$refs.consultationInput?.focus());
                },
                saveSession() {
                    if (this.stage !== 'result' || !this.result) return;
                    const session = {
                        id: Date.now(),
                        date: new Date().toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                        consultation: this.consultation,
                        history: this.history,
                        result: this.result,
                    };
                    this.savedSessions.unshift(session);
                    if (this.savedSessions.length > 50) this.savedSessions.length = 50;
                    this.saveSessions();
                },
                viewSession(session) {
                    this.selectedSession = session;
                },
                deleteSession(session) {
                    if (!confirm('この履歴を削除しますか？')) return;
                    this.savedSessions = this.savedSessions.filter(item => item.id !== session.id);
                    this.saveSessions();
                    if (this.selectedSession && this.selectedSession.id === session.id) this.selectedSession = null;
                },
                backToList() {
                    this.selectedSession = null;
                }
            },
            mounted() {
                this.loadSessions();
            }
        }).mount('#app');
    </script>
</body>
</html>
